name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w shared

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: TypeScript build
        run: npm run build

  test-api:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: goshopix
          POSTGRES_PASSWORD: goshopix
          POSTGRES_DB: goshopix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goshopix -d goshopix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      NODE_ENV: test
      DATABASE_URL: postgresql://goshopix:goshopix@localhost:5432/goshopix_test?schema=public
      JWT_SECRET: ci-jwt-secret-minimum-32-characters
      JOBS_ENABLED: 'false'
      RUN_INTEGRATION_TESTS: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run build -w shared

      - name: Prisma migrate
        working-directory: server
        run: npx prisma migrate deploy

      - name: Unit & integration tests
        run: npm run test -w server

  e2e:
    runs-on: ubuntu-latest
    needs: test-api
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: goshopix
          POSTGRES_PASSWORD: goshopix
          POSTGRES_DB: goshopix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goshopix -d goshopix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://goshopix:goshopix@localhost:5432/goshopix?schema=public
      JWT_SECRET: ci-jwt-secret-minimum-32-characters
      NODE_ENV: development
      JOBS_ENABLED: 'false'
      CORS_ORIGIN: http://127.0.0.1:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run build -w shared

      - name: Database setup
        working-directory: server
        run: |
          npx prisma migrate deploy
          npm run db:seed

      - name: Start API
        run: npm run start -w server &
        working-directory: .

      - name: Start frontend
        run: npm run dev -w client &

      - name: Wait for services
        run: |
          npx wait-on http://127.0.0.1:3000/api/health/live http://127.0.0.1:5173 -t 120000

      - name: Cypress E2E
        run: npm run test:e2e
